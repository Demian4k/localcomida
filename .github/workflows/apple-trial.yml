# Compila la versión de PRUEBA (20 días) para Mac e iOS en cada push a main.
name: Apple trial builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-trial:
    name: Mac .dmg (prueba)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          npm install
          npm install --prefix frontend
          npm install --prefix backend
          node -v
          npm -v
          test -d frontend/node_modules/vite
          test -d frontend/node_modules/typescript

      - name: Build UI (prueba 20 días)
        working-directory: frontend
        env:
          VITE_TRIAL: "1"
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html

      - name: Preparar cliente Mac
        env:
          VITE_TRIAL: "1"
        run: |
          set -euo pipefail
          npm run prepare-client:mac

      - name: Empaquetar .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          ARCH="$(node -p "process.arch === 'arm64' ? 'arm64' : 'x64'")"
          npx electron-builder --mac "--${ARCH}" --publish never \
            -c.appId=com.localcomida.pos.trial \
            -c.productName="LocalComida Prueba" \
            -c.mac.artifactName="LocalComida-prueba-\${version}-mac-\${arch}.\${ext}"
          ls -la dist-instalador

      - name: Subir .dmg / .zip
        uses: actions/upload-artifact@v6
        with:
          name: LocalComida-prueba-mac
          path: |
            dist-instalador/LocalComida-prueba-*.dmg
            dist-instalador/LocalComida-prueba-*.zip
          if-no-files-found: error
          retention-days: 30

  ios-trial:
    name: iOS (prueba)
    # Capacitor 8 requiere Xcode 26+ (no compila en Xcode 15/16).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Seleccionar Xcode 26
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          # Capacitor 8 necesita Xcode 26+
          xcodebuild -version | head -n1 | grep -E 'Xcode 26|Xcode 27'
      - name: Instalar dependencias
        run: |
          set -euo pipefail
          npm install
          npm install --prefix frontend
          npm install --prefix backend
          npm install --prefix mobile
          test -d mobile/node_modules/@capacitor/ios
          test -d mobile/node_modules/@capacitor/cli
          test -f mobile/node_modules/@capawesome/capacitor-nodejs/Package.swift

      - name: Build UI (prueba 20 días)
        working-directory: frontend
        env:
          VITE_TRIAL: "1"
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html

      - name: Bundle host + Capacitor iOS (SPM)
        run: |
          set -euo pipefail
          npm run bundle:host --prefix backend
          node mobile/scripts/copy-nodejs-into-dist.mjs
          cd mobile
          test -f capacitor.config.json
          # Capacitor 8 + @capawesome/capacitor-nodejs usan Swift Package Manager (no CocoaPods).
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          test -d ios/App/App.xcodeproj
          ls -la ios/App

      - name: Importar certificado iOS (opcional)
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.mobileprovision"

      - name: Compilar iOS (simulador)
        run: |
          set -euo pipefail
          mkdir -p dist-ios
          PROJECT="mobile/ios/App/App.xcodeproj"
          DERIVED="dist-ios/DerivedData"
          xcodebuild -project "$PROJECT" -scheme App -resolvePackageDependencies
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath "$DERIVED" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$DERIVED/Build/Products" -name '*.app' -type d | head -n 1)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist-ios/LocalComida-prueba-simulator.app.zip
          cat > dist-ios/LEEME-iOS.txt <<'EOF'
          LocalComida Prueba (iOS)
          =======================
          Incluye LocalComida-prueba-simulator.app.zip (Simulador Xcode).
          Para .ipa en iPhone/iPad reales hace falta Apple Developer + secrets
          (docs/GITHUB-APPLE-CI.md). Se bloquea a los 20 días.
          EOF
          ls -la dist-ios

      - name: Exportar IPA firmado (si hay certificados)
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          PROJECT="mobile/ios/App/App.xcodeproj"
          ARCHIVE="dist-ios/LocalComida-prueba.xcarchive"
          EXPORT_DIR="dist-ios/ipa"
          PLIST="dist-ios/ExportOptions.plist"
          METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" archive
          cat > "$PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${METHOD}</string>
            <key>compileBitcode</key><false/>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath "$EXPORT_DIR" -exportOptionsPlist "$PLIST"
          cp "$EXPORT_DIR"/*.ipa dist-ios/LocalComida-prueba.ipa

      - name: Subir artefactos iOS
        uses: actions/upload-artifact@v6
        with:
          name: LocalComida-prueba-ios
          path: |
            dist-ios/LocalComida-prueba-simulator.app.zip
            dist-ios/LocalComida-prueba.ipa
            dist-ios/LEEME-iOS.txt
          if-no-files-found: error
          retention-days: 30
