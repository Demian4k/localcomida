<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>LocalComida</title>
    <style>
      :root {
        --surface: #f7f7f9;
        --ink: #0a0a0a;
        --muted: #6b6b73;
        --border: #eaeaea;
        --danger: #dc2626;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--surface);
        color: var(--ink);
      }
      #app {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 2rem;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        text-align: center;
      }
      .sub {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      button {
        width: 100%;
        min-height: 52px;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: var(--ink);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        margin-top: 10px;
      }
      button.secondary {
        background: #fff;
        color: var(--ink);
      }
      button:disabled {
        opacity: 0.45;
      }
      .note {
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        margin-top: 12px;
        line-height: 1.4;
      }
      .err {
        color: var(--danger);
        font-size: 0.85rem;
        text-align: center;
        margin-top: 10px;
      }
      #reader {
        width: 100%;
        margin-top: 12px;
        border-radius: 1rem;
        overflow: hidden;
      }
      .list button {
        background: #fff;
        color: var(--ink);
        font-weight: 500;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
